<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Check-in</title>
  <link rel="stylesheet" href="css/bulma.min.css">
  <script src="js/xapiwrapper.min.js"></script>
</head>
<body class="has-background-dark" style="min-height: 100vh;">
  <section class="section">
    <div class="container">
      <div class="columns is-centered">
        <div class="column is-two-thirds-tablet is-half-desktop">
          <div class="box">
            
            <!-- Event Banner Header -->
            <div class="has-text-centered mb-5">
              <span class="tag is-warning is-light is-medium mb-2" id="hostDisplay">Loading host...</span>
              <h1 class="title is-3" id="eventDisplay">Event Check-in</h1>
              <p class="subtitle is-6">Please fill in your details to record your attendance.</p>
            </div>

            <!-- Form -->
            <form id="checkinForm">
              <!-- Hidden fields populated from URL -->
              <input type="hidden" id="eventName" />
              <input type="hidden" id="creatorName" />
              <input type="hidden" id="creatorEmail" />

              <!-- Attendee Name -->
              <div class="field">
                <label class="label">Your Name</label>
                <div class="control">
                  <input class="input" type="text" id="attendeeName" placeholder="e.g. Alex Mercer" required>
                </div>
              </div>

              <!-- Attendee ID -->
              <div class="field">
                <label class="label">Your ID</label>
                <div class="control">
                  <input class="input" type="text" id="attendeeId" placeholder="e.g. 123456" required>
                </div>
              </div>

              <div class="field" id="comment_block" style="display: none;">
                <label class="label">Comments or Feedback</label>
                <div class="control">
                  <textarea class="textarea" rows="3" id="comments" placeholder="Feedback comments"></textarea>
                </div>
              </div>

              
              <div class="field" id="rating_block" style="display: none;">
                <label class="label">Your Rating</label>
                  <div class="control">
                    <div class="radios">
                      <label class="radio"> <input type="radio" name="rate" value="1"/> 1 ★</label>
                      <label class="radio"> <input type="radio" name="rate" value="2"/> 2 ★</label>
                      <label class="radio"> <input type="radio" name="rate" value="3"/> 3 ★</label>
                      <label class="radio"> <input type="radio" name="rate" value="4"/> 4 ★</label>
                      <label class="radio"> <input type="radio" name="rate" value="5" checked/> 5 ★</label>
 
</div>
  </div>
</div>



              <!-- Submit Button -->
              <div class="field mt-5">
                <div class="control">
                  <button type="submit" class="button is-warning is-fullwidth" id="submitBtn">
                    Confirm Attendance
                  </button>
                </div>
              </div>
            </form>

            <!-- Success Notification -->
            <div id="successMessage" class="notification is-success is-light is-hidden mt-5 has-text-centered">
              <p class="title is-5 mb-2">Check-in Complete!</p>
              <p>Your attendance statement has been successfully logged.</p>
            </div>

            <!-- Error Notification -->
            <div id="errorMessage" class="notification is-danger is-light is-hidden mt-5 has-text-centered">
              <p id="errorText">Failed to send attendance record. Please try again.</p>
            </div>

          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    // -------------------------------------------------------------
    // LRS CONFIGURATION - Replace with your endpoint & credentials
    // -------------------------------------------------------------


    // 1. Extract URL Parameters on Load
    document.addEventListener('DOMContentLoaded', () => {

    

      const params = new URLSearchParams(window.location.search);
      const encodedData = params.get('data');
      let eventData = {};

      if (encodedData) {
        try {
          eventData = JSON.parse(atob(encodedData));
        } catch (e) {
          console.error("Failed to decode or parse Base64 data from URL.", e);
        }
      }

      // Set input values & UI display
      document.getElementById('eventName').value = eventData.event || 'Event Attendance';
      document.getElementById('creatorName').value = eventData.creator || 'Organizer';
      document.getElementById('eventDisplay').textContent = (eventData.event || 'Event Check-in').replace(/_/g, ' ');
      document.getElementById('hostDisplay').textContent = `Hosted by ${eventData.creator || 'Organizer'}`;

      const hasComments = JSON.parse(atob(new URLSearchParams(window.location.search).get('data'))).cm;
      const hasRating = JSON.parse(atob(new URLSearchParams(window.location.search).get('data'))).rt;
      const hasAnon = JSON.parse(atob(new URLSearchParams(window.location.search).get('data'))).an;

      if (hasComments) {
        document.getElementById('comment_block').style.display = 'block';
      }

      if (hasRating) {
        document.getElementById('rating_block').style.display = 'block';
      }

    });

    // 2. Handle Form Submission & xAPI Construction
    document.getElementById('checkinForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.classList.add('is-loading');

      // Recreate variables for consistency with create.html
      const attendeeName = document.getElementById('attendeeName').value.trim();
      const attendeeId = document.getElementById('attendeeId').value.trim();
      const eventNameWithSpaces = document.getElementById('eventName').value;
      const eventNameForUrl = eventNameWithSpaces.replaceAll(' ', '');
      const creatorName = document.getElementById('creatorName').value;
      // We need the registration from the decoded data to build the activity ID
      const registration = JSON.parse(atob(new URLSearchParams(window.location.search).get('data'))).reg;
      const passwordField = JSON.parse(atob(new URLSearchParams(window.location.search).get('data'))).pw;


      const rateButton = document.querySelector('input[name="rate"]:checked');
      const rateValue = rateButton.value;

      const commentValue = document.getElementById('comments').value;


      


       var statement = {
      //actor
      "actor" : {
        "objectType" : "Agent",
        "name" : attendeeName,
        "account": {
          "homePage": "https://nzdf.mil.nz",
          "name": attendeeId
          }
        },

        //verb
        "verb" : ADL.verbs.attended,

        //object
        "object" : {
          "id" : `https://nzdf.mil.nz/xapi/activities/events/${registration}/${encodeURIComponent(eventNameForUrl)}`,
          "definition" : {
            "name" : {
              "en" : eventNameWithSpaces
            },
          },
        },

        "context" : {
          "registration" : registration,
          "platform" : "NZ ADL Event Creator",
        },

        "id" : ADL.ruuid(),

        "result" : {
          "score" : {
            "raw" : Number(rateValue) || 5,
            "min" : 1,
            "max" : 5
          },

          "response" : commentValue

        }

    }

    console.log(statement);


     const WORKER_URL = "https://xapi.nzadl.deno.net/";

    // Send statement to Cloudflare Worker via async fetch
      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-API-Pass": passwordField // Pass the password from targetUrl input
          },
          body: JSON.stringify(statement)
        });

        if (response.ok) {
          console.log(`[${statement.id}]: Attendance statement successfully dispatched.`);
          document.getElementById('checkinForm').classList.add('is-hidden');
          document.getElementById('errorMessage').classList.add('is-hidden');
          document.getElementById('successMessage').classList.remove('is-hidden');
        } else {
          const errData = await response.json().catch(() => ({}));
          console.error(`Worker error (${response.status}):`, errData);
          document.getElementById('errorText').textContent = `Failed to log attendance: ${errData.error || response.statusText}`;
          document.getElementById('successMessage').classList.add('is-hidden');
          document.getElementById('errorMessage').classList.remove('is-hidden');
        }
      } catch (err) {
        console.error("Network error sending statement:", err);
        document.getElementById('errorText').textContent = 'A network error occurred. Could not send attendance record.';
        document.getElementById('successMessage').classList.add('is-hidden');
        document.getElementById('errorMessage').classList.remove('is-hidden');
      } finally {
        // Re-enable the button
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.classList.remove('is-loading');
        submitBtn.disabled = false;
      }

  



      
    });
  </script>
</body>
</html>
