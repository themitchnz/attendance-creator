<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event QR Code Generator</title>

  <link rel="stylesheet" href="css/bulma.min.css">

  <script src="js/xapiwrapper.min.js"></script>
  <script src="js/easy.qrcode.min.js"></script>
</head>
<body class="has-background-dark" style="min-height: 100vh;">
  <section class="section">
    <div class="container">
      <div class="columns is-centered">
        <div class="column is-two-thirds-tablet is-half-desktop">
          <div class="box">
            <h1 class="title is-4 has-text-centered mb-5">Create Event QR Code</h1>

            <form id="qrForm">
              <!-- Target Form URL -->
              <div class="field">
                <label class="label">Password</label>
                <div class="control">
                  <input class="input" type="text" id="targetUrl" placeholder="password" required>
                </div>
              </div>

              <!-- Event Name -->
              <div class="field">
                <label class="label">Event / Location Name</label>
                <div class="control">
                  <input class="input" type="text" id="eventName" placeholder="Event Name" required>
                </div>
              </div>

<div class="field">
  <label class="label">Attendance Options</label>
  <div class="checkboxes">
  <label class="checkbox">
    <input type="checkbox" id="rating"/>
    Rating
  </label>

  <label class="checkbox">
    <input type="checkbox" id="comments"/>
    Comments
  </label>
  <label class="checkbox">
    <input type="checkbox" id="anon"/>
    Anonymous
  </label>
  </div>
</div>
              

              <!-- Creator Name -->
              <div class="field">
                <label class="label">Host Name</label>
                <div class="control">
                  <input class="input" type="text" id="creatorName" placeholder="Host Name" required>
                </div>
              </div>

              <!-- Creator Email -->
              <div class="field">
                <label class="label">Host ID</label>
                <div class="control">
                  <input class="input" type="text" id="creatorId" placeholder="e.g. A12345" required>
                </div>
              </div>

              <!-- Submit Button -->
              <div class="field mt-5">
                <div class="control">
                  <button type="submit" class="button is-warning is-fullwidth">Generate QR Code</button>
                </div>
              </div>
            </form>

            <!-- Result Panel -->
            <div id="qrResult" class="is-hidden mt-6 has-text-centered">
              <hr>
              <h2 class="subtitle is-5 font-weight-bold mb-3">Your Generated QR Code</h2>
              
              <div id="qrcode" class="is-flex is-justify-content-center my-4"></div>

              <!-- Action Buttons -->
              <div class="buttons is-centered mt-4">
                <button type="button" class="button is-info is-light" id="openModalBtn">
                  <span>View Fullscreen</span>
                </button>
                <button type="button" class="button is-success" id="downloadInlineBtn">
                  <span>Download PNG</span>
                </button>
              </div>

              <div class="field mt-3">
                <label class="label is-small">Encoded Link:</label>
                <p class="is-size-7 has-text-grey-dark is-family-monospace" id="encodedUrlPreview" style="word-break: break-all;"></p>
              </div>

              <!-- Statement Status Notification -->
              <div id="statementStatus" class="notification is-hidden mt-4 mx-auto" style="max-width: 75%;">
                <button class="delete" id="closeStatusBtn"></button>
                <span id="statementStatusText"></span>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Fullscreen Modal Display -->
  <div class="modal" id="qrModal">
    <div class="modal-background" id="modalBg"></div>
    <div class="modal-content">
      <div class="box has-text-centered p-6">
        <h2 class="title is-3 mb-2" id="modalEventTitle">Event Name</h2>
        <p class="subtitle is-6 has-text-grey mb-5" id="modalCreatorTitle">Hosted by Creator</p>
        
        <!-- Large QR Display Container -->
        <div id="modalQrcode" class="is-flex is-justify-content-center my-4"></div>
        
        <div class="buttons is-centered mt-5">
          <button type="button" class="button is-success" id="downloadModalBtn">
            <span>Download High-Res PNG</span>
          </button>
        </div>

        <p class="help mt-2">Scan with your camera to open the form</p>
      </div>
    </div>
    <button class="modal-close is-large" aria-label="close" id="modalCloseBtn"></button>
  </div>

  <script>
    let currentFullUrl = '';
    let currentEventName = '';

    document.getElementById('qrForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const submitButton = e.target.querySelector('button[type="submit"]');

      const baseUrl = "https://themitchnz.github.io/attendance-creator/attend.html";
      const eventNameWithSpaces = document.getElementById('eventName').value.trim();
      const hasRating = document.getElementById('rating').checked;
      const hasComments = document.getElementById('comments').checked;
      const hasAnon = document.getElementById('anon').checked;
      const creatorName = document.getElementById('creatorName').value.trim();
      const creatorId = document.getElementById('creatorId').value.trim();
      const passwordField = document.getElementById('targetUrl').value.trim();

      const registration = ADL.ruuid();
      const eventNameForUrl = eventNameWithSpaces.replaceAll(' ', '');

      // 1. Construct URL with query parameters
      const dataToEncode = {
        pw: passwordField,
        event: eventNameWithSpaces,
        creator: creatorName,
        reg: registration,
        rt: hasRating,
        cm: hasComments,
        an: hasAnon
      };

      // JSON.stringify, then Base64 encode
      const encodedData = btoa(JSON.stringify(dataToEncode));

      const url = new URL(baseUrl);
      url.searchParams.set('data', encodedData);
      currentFullUrl = url.toString();
      

      // 2. Render standard inline QR code
      const inlineContainer = document.getElementById('qrcode');
      inlineContainer.innerHTML = '';
      new QRCode(inlineContainer, {
        text: currentFullUrl,
        width: 256,
        height: 256,
        correctLevel: QRCode.CorrectLevel.H
      });

      // 3. Update Text Previews
      document.getElementById('encodedUrlPreview').textContent = currentFullUrl;
      document.getElementById('modalEventTitle').textContent = eventNameWithSpaces;
      document.getElementById('modalCreatorTitle').textContent = `Hosted by ${creatorName}`;

      // 4. Show output section
      document.getElementById('qrResult').classList.remove('is-hidden');

      // 5. Prepare and send statement (with visual feedback)
      const statementStatus = document.getElementById('statementStatus');
      statementStatus.classList.remove('is-hidden', 'is-success', 'is-danger', 'is-light');
      const statementStatusText = document.getElementById('statementStatusText');
      statementStatus.classList.add('is-info', 'is-light');
      statementStatusText.textContent = 'Logging creation event...';

      submitButton.classList.add('is-loading');
      submitButton.disabled = true;
      
    var statement = {
      //actor
      "actor" : {
        "objectType" : "Agent",
        "name" : creatorName,
        "account": {
          "homePage": "https://nzdf.mil.nz",
          "name": creatorId
          }
        },

        //verb
        "verb" : ADL.verbs.initialized,

        //object
        "object" : {
          "id" : `https://nzdf.mil.nz/xapi/activities/events/${registration}/${encodeURIComponent(eventNameForUrl)}`,
          "definition" : {
            "name" : { "en" : eventNameWithSpaces },
            "extensions" : {
              "https://nzdf.mil.nz/xapi/activities/events/eventQR_URL" : currentFullUrl
            },
          },
        },

        "context" : {
          "registration" : registration,
          "platform" : "NZ ADL Event Creator",
        },

        "id" : ADL.ruuid(),

    }


    console.log(statement);


    const WORKER_URL = "https://xapi.nzadl.deno.net/";

    // Send statement to Cloudflare Worker via async fetch
      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-API-Pass": passwordField // Pass the password from targetUrl input
          },
          body: JSON.stringify(statement)
        });

        if (response.ok) {
          console.log(`[${statement.id}]: Statement successfully dispatched to Worker.`);
          statementStatus.classList.remove('is-info');
          statementStatus.classList.add('is-success');
          statementStatusText.textContent = 'Event creation successfully logged.';
        } else {
          const errData = await response.json().catch(() => ({}));
          console.error(`Worker error (${response.status}):`, errData);
          statementStatus.classList.remove('is-info');
          statementStatus.classList.add('is-danger');
          statementStatusText.textContent = `Failed to log event: ${errData.error || response.statusText}`;
        }
      } catch (err) {
        console.error("Network error sending statement:", err);
        statementStatus.classList.remove('is-info');
        statementStatus.classList.add('is-danger');
        statementStatusText.textContent = 'Network error. Could not log event.';
      }

/*
    ADL.XAPIWrapper.sendStatement(stmt, function(response, obj) {  
        console.log("[" + obj.id + "]: " + response.status + " - " + response.statusText);

        if (response.ok || response.status === 200) {
          document.getElementById('checkinForm').classList.add('is-hidden');
          document.getElementById('errorMessage').classList.add('is-hidden');
          document.getElementById('successMessage').classList.remove('is-hidden');
        } else {
          throw new Error(`LRS responded with status: ${response.status}`);
        }
      } 
    );

    */

      submitButton.classList.remove('is-loading');
      submitButton.disabled = false;
    });

    // Helper: Download QR Image from Container
    function downloadQRCode(containerId) {
      const container = document.getElementById(containerId);
      // EasyQRCodeJS creates either a <canvas> or an <img> tag depending on the browser
      const img = container.querySelector('img');
      const canvas = container.querySelector('canvas');

      let imageSrc = '';

      if (canvas) {
        imageSrc = canvas.toDataURL("image/png");
      } else if (img) {
        imageSrc = img.src;
      }

      if (!imageSrc) return;

      // Sanitize event name for filename
      const safeFileName = (eventNameWithSpaces || 'event').replaceAll(' ', '_').toLowerCase();

      // Trigger download using hidden anchor element
      const link = document.createElement('a');
      link.href = imageSrc;
      link.download = `${safeFileName}-qr-code.png`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Modal Control Functions
    const modal = document.getElementById('qrModal');
    const modalQrContainer = document.getElementById('modalQrcode');

    function openModal() {
      // Re-render a larger QR code specifically sized for high-res display/download
      modalQrContainer.innerHTML = '';
      new QRCode(modalQrContainer, {
        text: currentFullUrl,
        width: 400,
        height: 400,
        correctLevel: QRCode.CorrectLevel.H
      });

      modal.classList.add('is-active');
    }

    function closeModal() {
      modal.classList.remove('is-active');
    }

    // Event Listeners
    document.getElementById('openModalBtn').addEventListener('click', openModal);
    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    document.getElementById('modalBg').addEventListener('click', closeModal);

    document.getElementById('closeStatusBtn').addEventListener('click', () => {
      document.getElementById('statementStatus').classList.add('is-hidden');
    });

    // Download Button Listeners
    document.getElementById('downloadInlineBtn').addEventListener('click', () => downloadQRCode('qrcode'));
    document.getElementById('downloadModalBtn').addEventListener('click', () => downloadQRCode('modalQrcode'));

    // Close on 'Escape' key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('is-active')) {
        closeModal();
      }
    });
  </script>
</body>
</html>
