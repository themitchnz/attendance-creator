<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event QR Code Generator</title>

  <link rel="stylesheet" href="css/bulma.min.css">

  <script src="js/easy.qrcode.min.js"></script>
</head>
<body class="has-background-light" style="min-height: 100vh;">
  <section class="section">
    <div class="container">
      <div class="columns is-centered">
        <div class="column is-two-thirds-tablet is-half-desktop">
          <div class="box">
            <h1 class="title is-4 has-text-centered mb-5">Create Event QR Code</h1>

            <form id="qrForm">
              <!-- Target Form URL -->
              <div class="field">
                <label class="label">Target Form URL</label>
                <div class="control">
                  <input class="input" type="url" id="targetUrl" placeholder="http://127.0.0.1:5502/attend.html" required>
                </div>
                <p class="help">The URL where attendees will submit their details.</p>
              </div>

              <!-- Event Name -->
              <div class="field">
                <label class="label">Event / Location Name</label>
                <div class="control">
                  <input class="input" type="text" id="eventName" placeholder="Fleet Gym" required>
                </div>
              </div>

              <!-- Creator Name -->
              <div class="field">
                <label class="label">Host Name</label>
                <div class="control">
                  <input class="input" type="text" id="creatorName" placeholder="Recruit PT swim" required>
                </div>
              </div>

              <!-- Creator Email -->
              <div class="field">
                <label class="label">Host ID</label>
                <div class="control">
                  <input class="input" type="text" id="creatorId" placeholder="e.g. 12345 or staff-alex" required>
                </div>
                <p class="help">A unique ID for the event creator/host.</p>
              </div>

              <!-- Submit Button -->
              <div class="field mt-5">
                <div class="control">
                  <button type="submit" class="button is-primary is-fullwidth">Generate QR Code</button>
                </div>
              </div>
            </form>

            <!-- Result Panel -->
            <div id="qrResult" class="is-hidden mt-6 has-text-centered">
              <hr>
              <h2 class="subtitle is-5 font-weight-bold mb-3">Your Generated QR Code</h2>
              
              <div id="qrcode" class="is-flex is-justify-content-center my-4"></div>

              <!-- Action Buttons -->
              <div class="buttons is-centered mt-4">
                <button type="button" class="button is-info is-light" id="openModalBtn">
                  <span>View Fullscreen</span>
                </button>
                <button type="button" class="button is-success" id="downloadInlineBtn">
                  <span>Download PNG</span>
                </button>
              </div>

              <div class="field mt-3">
                <label class="label is-small">Encoded Link:</label>
                <p class="is-size-7 has-text-grey-dark is-family-monospace" id="encodedUrlPreview" style="word-break: break-all;"></p>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Fullscreen Modal Display -->
  <div class="modal" id="qrModal">
    <div class="modal-background" id="modalBg"></div>
    <div class="modal-content">
      <div class="box has-text-centered p-6">
        <h2 class="title is-3 mb-2" id="modalEventTitle">Event Name</h2>
        <p class="subtitle is-6 has-text-grey mb-5" id="modalCreatorTitle">Hosted by Creator</p>
        
        <!-- Large QR Display Container -->
        <div id="modalQrcode" class="is-flex is-justify-content-center my-4"></div>
        
        <div class="buttons is-centered mt-5">
          <button type="button" class="button is-success" id="downloadModalBtn">
            <span>Download High-Res PNG</span>
          </button>
        </div>

        <p class="help mt-2">Scan with your camera to open the form</p>
      </div>
    </div>
    <button class="modal-close is-large" aria-label="close" id="modalCloseBtn"></button>
  </div>

  <script>
    let currentFullUrl = '';
    let currentEventName = '';

    document.getElementById('qrForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const baseUrl = document.getElementById('targetUrl').value.trim();
      currentEventName = document.getElementById('eventName').value.trim();
      const creatorName = document.getElementById('creatorName').value.trim();
      const creatorId = document.getElementById('creatorId').value.trim();

      // 1. Construct URL with query parameters
      const url = new URL(baseUrl);
      url.searchParams.set('event', currentEventName);
      url.searchParams.set('creator', creatorName);
      url.searchParams.set('id', creatorId);
      currentFullUrl = url.toString();

      // 2. Render standard inline QR code
      const inlineContainer = document.getElementById('qrcode');
      inlineContainer.innerHTML = '';
      new QRCode(inlineContainer, {
        text: currentFullUrl,
        width: 180,
        height: 180,
        correctLevel: QRCode.CorrectLevel.H
      });

      // 3. Update Text Previews
      document.getElementById('encodedUrlPreview').textContent = currentFullUrl;
      document.getElementById('modalEventTitle').textContent = currentEventName;
      document.getElementById('modalCreatorTitle').textContent = `Hosted by ${creatorName}`;

      // 4. Show output section
      document.getElementById('qrResult').classList.remove('is-hidden');
    });

    // Helper: Download QR Image from Container
    function downloadQRCode(containerId) {
      const container = document.getElementById(containerId);
      // EasyQRCodeJS creates either a <canvas> or an <img> tag depending on the browser
      const img = container.querySelector('img');
      const canvas = container.querySelector('canvas');

      let imageSrc = '';

      if (canvas) {
        imageSrc = canvas.toDataURL("image/png");
      } else if (img) {
        imageSrc = img.src;
      }

      if (!imageSrc) return;

      // Sanitize event name for filename
      const safeFileName = (currentEventName || 'event').replace(/[^a-z0-9]/gi, '_').toLowerCase();

      // Trigger download using hidden anchor element
      const link = document.createElement('a');
      link.href = imageSrc;
      link.download = `${safeFileName}-qr-code.png`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Modal Control Functions
    const modal = document.getElementById('qrModal');
    const modalQrContainer = document.getElementById('modalQrcode');

    function openModal() {
      // Re-render a larger QR code specifically sized for high-res display/download
      modalQrContainer.innerHTML = '';
      new QRCode(modalQrContainer, {
        text: currentFullUrl,
        width: 320,
        height: 320,
        correctLevel: QRCode.CorrectLevel.H
      });

      modal.classList.add('is-active');
    }

    function closeModal() {
      modal.classList.remove('is-active');
    }

    // Event Listeners
    document.getElementById('openModalBtn').addEventListener('click', openModal);
    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    document.getElementById('modalBg').addEventListener('click', closeModal);

    // Download Button Listeners
    document.getElementById('downloadInlineBtn').addEventListener('click', () => downloadQRCode('qrcode'));
    document.getElementById('downloadModalBtn').addEventListener('click', () => downloadQRCode('modalQrcode'));

    // Close on 'Escape' key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('is-active')) {
        closeModal();
      }
    });
  </script>
</body>
</html>
